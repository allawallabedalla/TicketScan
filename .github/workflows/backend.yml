# Spielt Migrationen ein und rollt alle Endpunkte aus — ohne Terminal.
#
# Bewusst NUR von Hand auslösbar (Actions → „Backend veröffentlichen" →
# Run workflow), nie bei einem Push. Ein beiläufiger Commit soll das Schema
# nicht unter laufendem Einlass ändern können; genau davor warnt der
# Abschnitt „Wenn die GitHub-Verknüpfung aktiv ist" in docs/einrichtung.md.
#
# Einmalig drei Repository-Secrets anlegen (Settings → Secrets and variables
# → Actions):
#   SUPABASE_ACCESS_TOKEN  supabase.com → Account → Access Tokens; braucht nur
#                          „Edge Functions: Read & Write"
#   SUPABASE_DB_URL        Dashboard → Connect → „Session pooler" (Port 5432),
#                          [YOUR-PASSWORD] durch das Datenbank-Passwort ersetzt
#   SUPABASE_PROJECT_REF   der Teil vor .supabase.co
#
# Bewusst OHNE `supabase link`. Die Verknüpfung fragt eine ganze Reihe von
# Verwaltungsschnittstellen ab (API-Schlüssel, Dienstkonfiguration …) und
# scheiterte mit einem eng zugeschnittenen Zugangsschlüssel an immer neuen
# fehlenden Rechten. Migrationen gehen direkt über die Verbindungsadresse,
# Endpunkte über die Projektkennung — mehr braucht es nicht.
#
# Session pooler, nicht die direkte Verbindung: Die direkte Adresse ist nur
# über IPv6 erreichbar, und die GitHub-Runner haben kein IPv6.
#
# Geheimnisse der Endpunkte (Eventpasswort, Tokengeheimnis …) setzt dieser
# Ablauf NICHT. Sie bleiben im Dashboard unter Edge Functions → Secrets und
# gehören in kein Repo, auch nicht als Secret für diesen Ablauf.

name: Backend veröffentlichen

on:
  workflow_dispatch:
    inputs:
      nur_pruefen:
        description: "Nur anzeigen, was eingespielt würde (nichts ändern)"
        type: boolean
        default: true

permissions:
  contents: read

# Nie zwei gleichzeitig — eine halb eingespielte Migrationsfolge ist schlimmer
# als eine fehlende.
concurrency:
  group: backend
  cancel-in-progress: false

jobs:
  ausrollen:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      # Dieselbe Sperre wie für die App. Ein Schema, das am Donnerstag läuft,
      # läuft bis Sonntag unverändert.
      - name: Sperre prüfen
        run: |
          if [ -f DEPLOY-GESPERRT ]; then
            echo "::error::Veröffentlichung gesperrt: $(cat DEPLOY-GESPERRT)"
            exit 1
          fi
          if [ "${{ github.ref_name }}" != "claude/festival-ticket-scanner-app-20ycst" ]; then
            echo "::error::Nur vom Zweig claude/festival-ticket-scanner-app-20ycst aus, nicht von ${{ github.ref_name }}."
            exit 1
          fi

      # Fehlt ein Secret, scheitert die CLI sonst mit einer Meldung, die auf
      # alles Mögliche zeigt, nur nicht auf das fehlende Secret.
      - name: Secrets vorhanden?
        run: |
          fehlt=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || fehlt="$fehlt SUPABASE_ACCESS_TOKEN"
          [ -n "$DB_URL" ]                || fehlt="$fehlt SUPABASE_DB_URL"
          [ -n "$REF" ]                   || fehlt="$fehlt SUPABASE_PROJECT_REF"
          if [ -n "$fehlt" ]; then
            echo "::error::Repository-Secrets fehlen:$fehlt (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          case "$DB_URL" in
            *YOUR-PASSWORD*) echo "::error::In SUPABASE_DB_URL steht noch [YOUR-PASSWORD] — durch das Datenbank-Passwort ersetzen."; exit 1 ;;
            postgres://*|postgresql://*) ;;
            *) echo "::error::SUPABASE_DB_URL muss mit postgresql:// beginnen (Dashboard → Connect → Session pooler)."; exit 1 ;;
          esac

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Stand vorher
        run: supabase migration list --db-url "$DB_URL"

      - name: Migrationen (Probelauf)
        if: ${{ inputs.nur_pruefen }}
        run: supabase db push --dry-run --db-url "$DB_URL"

      - name: Migrationen einspielen
        if: ${{ !inputs.nur_pruefen }}
        run: supabase db push --db-url "$DB_URL"

      # Alle fünf, immer. `stats` fehlte beim Ausrollen von Hand am
      # häufigsten — hier kann keiner vergessen werden.
      - name: Endpunkte ausrollen
        if: ${{ !inputs.nur_pruefen }}
        run: |
          for f in session scans changes stats verwaltung; do
            echo "::group::$f"
            supabase functions deploy "$f" --project-ref "$REF" --no-verify-jwt --use-api
            echo "::endgroup::"
          done

      - name: Stand nachher
        if: ${{ !inputs.nur_pruefen }}
        run: supabase migration list --db-url "$DB_URL"
