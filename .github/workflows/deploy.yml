# Baut die App und veröffentlicht sie auf GitHub Pages.
#
# Läuft bei jedem Push auf den Arbeitszweig und lässt sich von Hand auslösen.
#
# WICHTIG vor dem Festival: Ab dem Vortag nicht mehr ausrollen. Ein fehlerhafter
# Build verteilt sich über den Service Worker auf alle Geräte gleichzeitig. Was
# am Donnerstag läuft, läuft bis Sonntag unverändert.
#
# Dafür gibt es die Datei DEPLOY-GESPERRT im Wurzelverzeichnis: Liegt sie da,
# bricht dieser Ablauf unten mit einer klaren Meldung ab. Anlegen, pushen,
# fertig. Zum Aufheben löschen und pushen — die Datei steht in `paths`, der
# Lauf startet also von selbst.

name: App veröffentlichen

on:
  push:
    branches: [claude/festival-ticket-scanner-app-20ycst]
    paths: ["web/**", ".github/workflows/deploy.yml", "DEPLOY-GESPERRT"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Ausrollen zur Zeit; ein laufendes wird nicht abgebrochen, damit keine
# halb veröffentlichte Fassung entsteht.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Veröffentlichungssperre. Ab dem Vortag des Festivals wird die Datei
      # DEPLOY-GESPERRT angelegt; danach kommt kein neuer Stand mehr auf die
      # Geräte, egal wer was pusht. Ein fehlerhafter Build verteilt sich sonst
      # über den Service Worker auf alle zehn gleichzeitig.
      - name: Sperre prüfen
        run: |
          if [ -f DEPLOY-GESPERRT ]; then
            echo "::error::Veröffentlichung gesperrt: $(cat DEPLOY-GESPERRT)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: web
        run: npm ci

      - name: Bauen
        working-directory: web
        # Auf GitHub Pages liegt die App unter /TicketScan/. Der Unterpfad muss
        # auch in Service-Worker-Scope und Manifest landen, sonst lässt sie sich
        # nicht auf den Home-Bildschirm legen.
        env:
          VITE_BASE: /TicketScan/
          # Landet als Fassungskennung sichtbar in der App, damit sich aus der
          # Ferne unterscheiden lässt, ob ein Fehler noch besteht oder nur eine
          # alte Fassung im Cache hängt.
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build

      - name: Prüfen, dass die Texterkennung mit im Bundle liegt
        working-directory: web
        # Ohne diese Dateien liefe die Erkennung gegen ein fremdes CDN — und
        # ohne Netz gar nicht. Lieber hier scheitern als am Eingang.
        # Alle sechs Kern-Varianten müssen da sein. Welche der Browser
        # anfordert, entscheidet sich erst auf dem Gerät — fehlt genau die,
        # bricht die Erkennung dort mit einem 404 ab. Genau das ist passiert.
        run: |
          for f in worker.min.js eng.traineddata.gz \
                   tesseract-core.wasm.js tesseract-core-lstm.wasm.js \
                   tesseract-core-simd.wasm.js tesseract-core-simd-lstm.wasm.js \
                   tesseract-core-relaxedsimd.wasm.js \
                   tesseract-core-relaxedsimd-lstm.wasm.js; do
            test -s "dist/tesseract/$f" || { echo "Fehlt: dist/tesseract/$f"; exit 1; }
          done
          du -sh dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
